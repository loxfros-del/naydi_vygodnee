name: Apply Search V2 quota preflight

on:
  pull_request:
    paths:
      - .ci/apply-search-v2-preflight-workflow
      - .github/workflows/apply-search-v2-preflight-workflow.yml
      - tools/apply_search_v2_preflight_workflow.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-engine-v2
      - name: Patch acceptance workflow
        run: |
          python tools/apply_search_v2_preflight_workflow.py
          rm -f .github/workflows/apply-search-v2-preflight-workflow.yml
      - name: Commit quota guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/search-v2-acceptance.yml .github/workflows/apply-search-v2-preflight-workflow.yml tools/apply_search_v2_preflight_workflow.py .ci/apply-search-v2-preflight-workflow
          git commit -m "Guard Search V2 acceptance with provider quota preflight"
          git push origin HEAD:feature/search-engine-v2

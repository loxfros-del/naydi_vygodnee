name: Apply SearchApi acceptance repairs

on:
  pull_request:
    paths:
      - .ci/apply-searchapi-acceptance-repairs
      - .github/workflows/apply-searchapi-acceptance-repairs.yml
      - tools/apply_searchapi_acceptance_repairs.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-engine-v2
      - name: Apply source repairs
        run: |
          python tools/apply_searchapi_acceptance_repairs.py
          rm -f .github/workflows/apply-searchapi-acceptance-repairs.yml
      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/sources/searchapi_source.py tools/search_v2_acceptance.py tools/test_search_v2_acceptance_runner.py tools/apply_searchapi_acceptance_repairs.py .ci/apply-searchapi-acceptance-repairs .github/workflows/apply-searchapi-acceptance-repairs.yml
          git commit -m "Classify SearchApi limits and separate partial source errors"
          git push origin HEAD:feature/search-engine-v2

name: Search V2 acceptance once

on:
  pull_request:
    paths:
      - .ci/run-search-v2-acceptance-once
      - .github/workflows/search-v2-acceptance-once.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:acceptance_test_token"
      ADMIN_IDS: "1"
      SEARCH_V2_SHOPPING_PROVIDER: auto
      SEARCHAPI_ENABLED: "true"
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SERPAPI_ENABLED: "true"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full 30-case acceptance
        id: acceptance
        continue-on-error: true
        run: |
          python tools/search_v2_acceptance.py \
            --confirm-live \
            --cases tools/live_acceptance_cases.json \
            --output data/search_v2_acceptance.json \
            --limit 0 \
            --case-timeout 30 \
            --source-timeout 8 \
            --result-limit 10 \
            > search-v2-acceptance.log 2>&1
      - name: Show sanitized final summary
        if: always()
        run: |
          tail -160 search-v2-acceptance.log || true
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/search_v2_acceptance.json')
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps(payload.get('environment', {}), ensure_ascii=False, indent=2))
              print(json.dumps(payload.get('summary', {}), ensure_ascii=False, indent=2))
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-v2-acceptance-once
          path: |
            data/search_v2_acceptance.json
            search-v2-acceptance.log
          if-no-files-found: error
          retention-days: 30

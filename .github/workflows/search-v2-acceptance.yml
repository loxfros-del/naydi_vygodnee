name: Search V2 acceptance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Structured shopping provider
        required: true
        default: auto
        type: choice
        options:
          - auto
          - searchapi
          - serpapi
      limit:
        description: Number of cases, 0 means all 30
        required: true
        default: "0"
        type: string
      require_pass:
        description: Fail workflow unless acceptance targets pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: search-v2-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:acceptance_test_token"
      ADMIN_IDS: "1"
      SEARCH_V2_SHOPPING_PROVIDER: ${{ inputs.provider }}
      SEARCHAPI_ENABLED: "true"
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SERPAPI_ENABLED: "true"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.require_pass }}" = "true" ]; then
            EXTRA="--require-pass"
          fi
          python tools/search_v2_acceptance.py \
            --confirm-live \
            --cases tools/live_acceptance_cases.json \
            --output data/search_v2_acceptance.json \
            --limit "${{ inputs.limit }}" \
            --case-timeout 30 \
            --source-timeout 8 \
            --result-limit 10 \
            $EXTRA \
            > search-v2-acceptance.log 2>&1
      - name: Show final summary
        if: always()
        run: |
          tail -120 search-v2-acceptance.log || true
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/search_v2_acceptance.json')
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps(payload.get('summary', {}), ensure_ascii=False, indent=2))
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-v2-acceptance-${{ github.run_number }}
          path: |
            data/search_v2_acceptance.json
            search-v2-acceptance.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce requested result
        if: always() && inputs.require_pass
        run: test "${{ steps.acceptance.outcome }}" = "success"

name: Apply shopping provider circuit breaker

on:
  pull_request:
    paths:
      - .ci/apply-shopping-circuit-breaker
      - .github/workflows/apply-shopping-circuit-breaker.yml
      - tools/apply_shopping_circuit_breaker.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-engine-v2
      - name: Patch shopping adapter
        run: |
          python tools/apply_shopping_circuit_breaker.py
          rm -f .github/workflows/apply-shopping-circuit-breaker.yml
      - name: Commit circuit breaker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/search_v2/adapters/shopping_search.py tools/apply_shopping_circuit_breaker.py .ci/apply-shopping-circuit-breaker .github/workflows/apply-shopping-circuit-breaker.yml
          git commit -m "Stop repeated shopping calls after provider rate limits"
          git push origin HEAD:feature/search-engine-v2

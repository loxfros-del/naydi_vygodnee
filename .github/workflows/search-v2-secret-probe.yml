name: Search V2 secret probe

on:
  push:
    branches:
      - feature/search-engine-v2
    paths:
      - .ci/run-search-v2-secret-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:probe_test_token"
      ADMIN_IDS: "1"
      SEARCH_V2_SHOPPING_PROVIDER: auto
      SEARCHAPI_ENABLED: "true"
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SERPAPI_ENABLED: "true"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one-case provider probe
        id: probe
        continue-on-error: true
        run: |
          python tools/search_v2_acceptance.py \
            --confirm-live \
            --cases tools/live_acceptance_cases.json \
            --output data/search_v2_secret_probe.json \
            --limit 1 \
            --case-timeout 25 \
            --source-timeout 7 \
            --result-limit 8 \
            > search-v2-secret-probe.log 2>&1
      - name: Show sanitized environment summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/search_v2_secret_probe.json')
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps(payload.get('environment', {}), ensure_ascii=False, indent=2))
              print(json.dumps(payload.get('summary', {}), ensure_ascii=False, indent=2))
          PY
      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-v2-secret-probe
          path: |
            data/search_v2_secret_probe.json
            search-v2-secret-probe.log
          if-no-files-found: error
          retention-days: 3

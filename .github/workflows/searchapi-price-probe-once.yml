name: SearchApi price probe once

on:
  pull_request:
    paths:
      - .ci/run-searchapi-price-probe-once
      - .github/workflows/searchapi-price-probe-once.yml
      - tools/searchapi_price_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:probe_test_token"
      ADMIN_IDS: "1"
      SEARCHAPI_ENABLED: "true"
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SEARCHAPI_GL: ru
      SEARCHAPI_HL: ru
      SEARCHAPI_LOCATION: Russia
      SEARCHAPI_MAX_RESULTS: 5
      SEARCHAPI_TIMEOUT_SECONDS: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run one sanitized price probe
        run: python tools/searchapi_price_probe.py > searchapi-price-probe.log 2>&1
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: searchapi-price-probe-once
          path: |
            data/searchapi_price_probe.json
            searchapi-price-probe.log
          if-no-files-found: error
          retention-days: 7

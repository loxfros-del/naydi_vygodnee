name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-placeholder-token-not-a-secret
      ADMIN_IDS: "123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall .
      - name: Alice parser
        run: python tools/test_alice_parser.py
      - name: AI cards
        run: python tools/test_ai_cards.py
      - name: Report readiness
        run: python tools/test_report_readiness.py
      - name: DB migration
        run: python tools/test_db_migration.py

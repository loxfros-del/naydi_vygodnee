name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:ci_test_token"
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply one-shot Search V2 registry test update
        if: github.event_name == 'push' && hashFiles('.ci/apply-search-v2-registry-test-update') != ''
        run: |
          python tools/apply_search_v2_registry_test_update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/test_search_v2_adapters.py tools/apply_search_v2_registry_test_update.py .ci/apply-search-v2-registry-test-update
          git commit -m "Update Search V2 registry assertions"
          git push origin HEAD:feature/search-engine-v2
      - name: Compile
        run: python -m compileall -q .
      - name: Alice parser
        id: alice_parser
        continue-on-error: true
        run: python tools/test_alice_parser.py > alice-parser.log 2>&1
      - name: Upload Alice parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alice-parser-log
          path: alice-parser.log
          if-no-files-found: error
          retention-days: 7
      - name: Check Alice parser result
        if: always()
        run: |
          cat alice-parser.log
          test "${{ steps.alice_parser.outcome }}" = "success"
      - name: AI cards
        run: python tools/test_ai_cards.py
      - name: Report readiness
        run: python tools/test_report_readiness.py
      - name: DB migration
        run: python tools/test_db_migration.py
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m unittest discover > unit-tests.log 2>&1
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: unit-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Check unit test result
        if: always()
        run: |
          cat unit-tests.log
          test "${{ steps.unit_tests.outcome }}" = "success"
      - name: Codex smoke
        run: python tools/codex_smoke.py

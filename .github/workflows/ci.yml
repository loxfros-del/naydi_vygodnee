name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      BOT_TOKEN: "123456:ci_test_token"
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Alice parser
        id: alice_parser
        continue-on-error: true
        run: python tools/test_alice_parser.py > alice-parser.log 2>&1
      - name: Upload Alice parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alice-parser-log
          path: alice-parser.log
          if-no-files-found: error
          retention-days: 7
      - name: Check Alice parser result
        if: always()
        run: |
          cat alice-parser.log
          test "${{ steps.alice_parser.outcome }}" = "success"
      - name: AI cards
        run: python tools/test_ai_cards.py
      - name: Report readiness
        run: python tools/test_report_readiness.py
      - name: DB migration
        run: python tools/test_db_migration.py
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m unittest discover > unit-tests.log 2>&1
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: unit-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Check unit test result
        if: always()
        run: |
          cat unit-tests.log
          test "${{ steps.unit_tests.outcome }}" = "success"
      - name: Codex smoke
        run: python tools/codex_smoke.py
